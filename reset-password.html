<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PASF — Redefinir Senha</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/login.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="login-screen">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-mark" style="background: transparent; overflow: hidden; padding: 0;">
          <img src="assets/css/img/Pasf-logo.png" alt="Logo PASF" style="width: 100%; height: 100%; object-fit: cover;">
        </div>
        <div>
          <h1>Nova Senha</h1>
          <p>Crie uma nova senha de acesso.</p>
        </div>
      </div>

      <form id="resetForm">
        <label>Nova Senha</label>
        <input id="resetPass" type="password" placeholder="Mín. 8 caracteres, 1 maiúscula, 1 símbolo" required>
        
        <label>Confirmar Nova Senha</label>
        <input id="resetPassConfirm" type="password" placeholder="Repita a nova senha" required>
        
        <div id="resetError" class="login-error hidden"></div>
        <div id="resetInfo" class="login-success hidden"></div>
        
        <button type="submit" class="submit">Salvar nova senha</button>
      </form>
    </div>
  </div>

  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/reset-password.js"></script>
</body>
</html>
