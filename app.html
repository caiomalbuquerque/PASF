<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PASF — Plano de Ação para Sustentabilidade Financeira">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
  <title>PASF — Plano de Ação</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/views.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Tela de Loading -->
  <div id="loading-screen" style="display:flex;height:100vh;align-items:center;justify-content:center;flex-direction:column;color:#6b7280;font-family:sans-serif;">
    <div style="width:40px;height:40px;border:4px solid #e5e7eb;border-top-color:#0f4c81;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px;"></div>
    Carregando dados do PASF...
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
  </div>

  <!-- App Principal -->
  <div id="app" class="app hidden">
    
    <!-- Fundo escuro para mobile -->
    <div id="sidebarOverlay" class="sidebar-overlay hidden" onclick="toggleSidebar()"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="logo-mark">P</div>
        <div>
          <h2>PASF</h2>
          <span>Sustentabilidade Financeira</span>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
    </aside>

    <div class="main-wrapper">
      <header class="topbar">
        
        <!-- Botão Hamburger (Só aparece no mobile) -->
        <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>

        <!-- Seletor de Empresa na Topbar -->
        <div id="topbarCompanySelector" class="company-selector-container"></div>
        
        <div class="topbar-actions">
          <button class="icon-btn" id="bellBtn" title="Notificações" onclick="toggleNotifications(event)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            <span class="badge hidden" id="bellBadge">0</span>
          </button>
          
          <div class="topbar-user" id="userMenuBtn" onclick="toggleUserMenu(event)" style="cursor:pointer">
            <div class="avatar" id="topAvatar">?</div>
            <div>
              <div class="name" id="topName">— <span class="role-badge" id="topRole">—</span></div>
              <div class="role" id="topCompany">—</div>
            </div>
            <span style="font-size:10px;color:var(--gray-400);margin-left:4px">▼</span>
          </div>
        </div>
      </header>

      <main class="content">
        <section id="view-dashboard"     class="view hidden"></section>
        <section id="view-objetivos"     class="view hidden"></section>
        <section id="view-minhas"        class="view hidden"></section>
        <section id="view-responsaveis"  class="view hidden"></section>
        <section id="view-empresas"      class="view hidden"></section>
      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/state.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/permissions.js"></script>
  <script src="assets/js/services/users.js"></script>
  <script src="assets/js/services/audit.js"></script>
  <script src="assets/js/services/tasks.js"></script>
  <script src="assets/js/services/objectives.js"></script>
  <script src="assets/js/components/modal.js"></script>
  <script src="assets/js/components/task-card.js"></script>
  <script src="assets/js/views/dashboard.js"></script>
  <script src="assets/js/views/objectives.js"></script>
  <script src="assets/js/views/my-tasks.js"></script>
  <script src="assets/js/views/users.js"></script>
  <script src="assets/js/views/companies.js"></script>
  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/router.js"></script>
  
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
