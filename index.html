<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PASF — Plano de Ação para Sustentabilidade Financeira">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
  <title>PASF — Entrar</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/login.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="login-screen">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-mark">P</div>
        <div>
          <h1>PASF</h1>
          <p>Plano de Ação para Sustentabilidade Financeira</p>
        </div>
      </div>

      <form id="loginForm">
        <label for="loginEmail">E-mail</label>
        <input id="loginEmail" type="email" placeholder="seu@email.com" required autocomplete="username">
        <label for="loginPass">Senha</label>
        <input id="loginPass" type="password" placeholder="••••••" required autocomplete="current-password">
        <div id="loginError" class="login-error hidden"></div>
        <button type="submit" class="submit">Entrar</button>
      </form>
    </div>
  </div>

  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/state.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
