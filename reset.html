<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PASF — Redefinir senha">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
  <title>PASF — Redefinir senha</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/login.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="login-screen">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-mark">P</div>
        <div>
          <h1>Redefinir senha</h1>
          <p>Defina sua nova senha abaixo.</p>
        </div>
      </div>

      <form id="resetForm">
        <label for="resetPass">Nova senha</label>
        <input id="resetPass" type="password" placeholder="••••••" required minlength="6" autocomplete="new-password">
        <label for="resetPassConfirm">Confirme a nova senha</label>
        <input id="resetPassConfirm" type="password" placeholder="••••••" required minlength="6" autocomplete="new-password">
        <div id="resetError" class="login-error hidden"></div>
        <div id="resetInfo" class="login-info hidden"></div>
        <button type="submit" class="submit">Salvar nova senha</button>
      </form>

      <div style="text-align:center;margin-top:20px">
        <a href="index.html" style="font-size:12px;color:var(--primary);font-weight:600">Voltar para o login</a>
      </div>
    </div>
  </div>

  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/reset-password.js"></script>
</body>
</html>
